<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- 1. SEO ТЕГИ -->
    <title>CrackTime — узнай, за сколько взломают твой пароль</title>
    <meta name="description" content="Бесплатный локальный анализатор паролей. Узнай, сколько времени потребуется хакерам для взлома твоего пароля. Безопасно, без серверов.">
    <meta property="og:title" content="CrackTime | Проверь свой пароль">
    <meta property="og:description" content="Узнай, сколько времени потребуется хакерам для взлома твоего пароля.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://souwayy.github.io/cracktime/">

    <!-- 2. ИКОНКА САЙТА (Разбитый замок) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2300e676' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 2a4 4 0 0 0-4 4v2'/><path d='M16 6V4a4 4 0 0 0-4-4'/><rect x='4' y='8' width='16' height='12' rx='2'/><path d='M10 12l4 4M14 12l-4 4'/></svg>">

    <style>
        :root {
            --bg: #0f1115;
            --card-bg: #1a1d24;
            --text: #ffffff;
            --text-muted: #8b92a5;
            --accent: #00e676;
            --c-red: #ff3b30;
            --c-orange: #ff9500;
            --c-yellow: #ffcc00;
            --c-lgreen: #a3e635;
            --c-green: #34c759;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { width: 100%; max-width: 400px; margin-top: 30px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0 0 5px 0; font-size: 28px; letter-spacing: 1px; }
        .header p { margin: 0; color: var(--text-muted); font-size: 14px; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: var(--card-bg);
            border: 1px solid #2a2f3a;
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); }
        
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s;
        }
        .eye-icon:hover { fill: var(--text); }

        .trust-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }
        .analyze-btn:hover { opacity: 0.9; }
        .analyze-btn:active { transform: scale(0.98); }
        .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .chart-container {
            display: none;
            position: relative;
            height: 220px;
            margin-top: 40px;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 10px 20px 10px;
            border-bottom: 2px solid #2a2f3a;
        }
        
        .bar {
            width: 18%;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: all 0.4s ease;
            transform-origin: bottom center;
        }

        .bar span {
            font-size: 10px;
            font-weight: bold;
            color: #000;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            white-space: nowrap;
        }
        
        .bar-1 { height: 20%; background: var(--c-red); }
        .bar-2 { height: 40%; background: var(--c-orange); }
        .bar-3 { height: 60%; background: var(--c-yellow); }
        .bar-4 { height: 80%; background: var(--c-lgreen); }
        .bar-5 { height: 100%; background: var(--c-green); }

        .dimmed { opacity: 0.2; filter: grayscale(80%); }

        .active-bar {
            opacity: 1 !important;
            filter: grayscale(0%) brightness(1.1);
            animation: pulse-glow 1.5s infinite alternate;
            z-index: 5;
        }

        @keyframes pulse-glow {
            0% { transform: scale(1); box-shadow: 0 0 10px rgba(255, 255, 255, 0.2); }
            100% { transform: scale(1.05); box-shadow: 0 0 25px rgba(255, 255, 255, 0.7); }
        }

        .result-container {
            display: none;
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
            position: relative;
            z-index: 10;
        }
        .result-time { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .result-rank { font-size: 14px; color: var(--text-muted); margin-bottom: 15px;}
        .result-rank span { color: var(--text); font-weight: bold; }

        /* 4. КНОПКА ПОДЕЛИТЬСЯ */
        .share-btn {
            display: none;
            background: transparent;
            color: var(--text-muted);
            border: 1px dashed var(--text-muted);
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            margin: 0 auto;
        }
        .share-btn:hover {
            color: var(--accent);
            border-color: var(--accent);
        }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            padding: 20px 0;
            border-top: 1px solid #2a2f3a;
            line-height: 1.5;
        }
        
        .tg-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tg-btn:hover { background: rgba(0, 230, 118, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CrackTime</h1>
            <p>Проверь надежность своего пароля</p>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="введите пароль" autocomplete="off">
            <svg class="eye-icon" id="eyeIcon" onclick="togglePassword()" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </div>

        <div class="trust-text">
            Данные конфиденциальны.<br>Вычисления происходят локально.
        </div>

        <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">[ АНАЛИЗ ]</button>

        <div class="chart-container" id="chart">
            <div class="bar bar-1" id="bar1"><span>КРАХ</span></div>
            <div class="bar bar-2" id="bar2"><span>СЛАБО</span></div>
            <div class="bar bar-3" id="bar3"><span>СРЕДНЕ</span></div>
            <div class="bar bar-4" id="bar4"><span>СЛОЖНО</span></div>
            <div class="bar bar-5" id="bar5"><span>НЕВОЗМОЖНО</span></div>
        </div>

        <div class="result-container" id="result">
            <div class="result-time" id="timeText"></div>
            <div class="result-rank">Твой ранг: <span id="rankText"></span></div>
            <button class="share-btn" id="shareBtn" onclick="shareResult()">[ Поделиться результатом ]</button>
        </div>

        <div class="footer">
            Пароль — это база безопасности. Продвинутые методы защиты и анализа данных изучаем в моем Telegram.<br>
            <a href="https://t.me/pythonwave" target="_blank" class="tg-btn">Перейти в Telegram</a>
        </div>
    </div>

    <script>
        // Настройки уровней (ранги)
        const levels = [
            { rank: "[ ЧАЙНИК ]", color: "var(--c-red)", barId: "bar1" },
            { rank: "[ ДЫРЯВЫЙ ]", color: "var(--c-orange)", barId: "bar2" },
            { rank: "[ БДИТЕЛЬНЫЙ ]", color: "var(--c-yellow)", barId: "bar3" },
            { rank: "[ АНОНИМ ]", color: "var(--c-lgreen)", barId: "bar4" },
            { rank: "[ НЕСОКРУШИМЫЙ ]", color: "var(--c-green)", barId: "bar5" }
        ];

        const eyeOpen = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeClosed = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z";

        let currentRank = "";
        let currentTime = "";

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path d="${eyeClosed}"/>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path d="${eyeOpen}"/>`;
            }
        }

        // УМНАЯ МАТЕМАТИКА (Энтропия)
        function calculateSecurity(pwd) {
            if (pwd.length === 0) return { seconds: 0, level: 0 };
            
            // Словарь популярных паролей
            const common = ["123456", "12345678", "qwerty", "password", "12345", "123456789", "admin", "123123", "qwerty123", "1q2w3e", "qwertyuiop", "qazwsx", "1234567890"];
            if (common.includes(pwd.toLowerCase())) {
                return { seconds: 1, level: 0 }; // Чайник
            }

            let poolSize = 0;
            if (/[a-z]/.test(pwd)) poolSize += 26;
            if (/[A-Z]/.test(pwd)) poolSize += 26;
            if (/[0-9]/.test(pwd)) poolSize += 10;
            if (/[^A-Za-z0-9]/.test(pwd)) poolSize += 33;
            if (/[а-яА-Я]/.test(pwd)) poolSize += 33; // Русские буквы

            // Штраф за повторения и последовательности
            let repeats = 0;
            let sequences = 0;
            for (let i = 1; i < pwd.length; i++) {
                if (pwd[i] === pwd[i-1]) repeats++;
                if (pwd.charCodeAt(i) - pwd.charCodeAt(i-1) === 1) sequences++;
            }

            let entropy = pwd.length * Math.log2(poolSize || 1);
            entropy -= (repeats * 2) + (sequences * 2);
            if (entropy < 0) entropy = 0;

            // 10 млрд попыток в секунду
            let guesses = Math.pow(2, entropy);
            let seconds = guesses / 10000000000; 

            // Определение ранга по секундам
            let level = 0;
            if (seconds > 60) level = 1;                 // > 1 мин
            if (seconds > 86400) level = 2;              // > 24 часов
            if (seconds > 31536000) level = 3;           // > 1 года
            if (seconds > 31536000000) level = 4;        // > 1000 лет

            return { seconds: seconds, level: level };
        }

        // Красивое форматирование времени
        function formatTime(seconds) {
            if (seconds < 1) return "МГНОВЕННО";
            if (seconds < 60) return `${Math.round(seconds)} СЕКУНД`;
            if (seconds < 3600) return `${Math.round(seconds / 60)} МИНУТ`;
            if (seconds < 86400) return `${Math.round(seconds / 3600)} ЧАСОВ`;
            if (seconds < 2592000) return `${Math.round(seconds / 86400)} ДНЕЙ`;
            if (seconds < 31536000) return `${Math.round(seconds / 2592000)} МЕСЯЦЕВ`;
            
            let years = Math.round(seconds / 31536000);
            if (years > 1000000000) return "13.8 МЛРД ЛЕТ";
            if (years > 1000000) return `${Math.round(years / 1000000)} МЛН ЛЕТ`;
            if (years > 1000) return `${Math.round(years / 1000)} ТЫС. ЛЕТ`;
            return `${years} ЛЕТ`;
        }

        function analyze() {
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('analyzeBtn');
            const chart = document.getElementById('chart');
            const result = document.getElementById('result');
            const shareBtn = document.getElementById('shareBtn');
            
            if (!pwd) {
                alert("Введите пароль для анализа");
                return;
            }

            btn.disabled = true;
            btn.textContent = "АНАЛИЗ...";
            chart.style.display = "flex";
            result.style.display = "none";
            result.style.opacity = "0";
            shareBtn.style.display = "none";

            const allBars = document.querySelectorAll('.bar');
            allBars.forEach(bar => {
                bar.classList.remove('dimmed', 'active-bar');
            });

            const calc = calculateSecurity(pwd);
            const levelData = levels[calc.level];
            const targetBar = document.getElementById(levelData.barId);
            const finalTime = formatTime(calc.seconds);

            setTimeout(() => {
                allBars.forEach(bar => bar.classList.add('dimmed'));

                setTimeout(() => {
                    targetBar.classList.remove('dimmed');
                    targetBar.classList.add('active-bar');

                    setTimeout(() => {
                        document.getElementById('timeText').textContent = `ВРЕМЯ ВЗЛОМА: ${finalTime}`;
                        document.getElementById('timeText').style.color = levelData.color;
                        
                        document.getElementById('rankText').textContent = levelData.rank;
                        document.getElementById('rankText').style.color = levelData.color;

                        currentRank = levelData.rank;
                        currentTime = finalTime;

                        result.style.display = "block";
                        void result.offsetWidth; 
                        result.style.opacity = "1";
                        
                        shareBtn.style.display = "inline-block";

                        btn.disabled = false;
                        btn.textContent = "[ АНАЛИЗ ]";
                    }, 400); 
                }, 400); 
            }, 200);
        }

        // ПОДЕЛИТЬСЯ РЕЗУЛЬТАТОМ
        function shareResult() {
            const text = `Мой ранг в CrackTime: ${currentRank}. А какой уровень защиты у твоего пароля?`;
            const url = "https://souwayy.github.io/cracktime/";

            if (navigator.share) {
                navigator.share({
                    title: 'CrackTime',
                    text: text,
                    url: url
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(text + " " + url);
                alert("Текст скопирован! Можешь отправить его другу.");
            }
        }
    </script>
</body>
</html>
