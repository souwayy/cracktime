<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrackTime | Проверка надежности</title>
    <style>
        :root {
            --bg: #0f1115;
            --card-bg: #1a1d24;
            --text: #ffffff;
            --text-muted: #8b92a5;
            --accent: #00e676;
            --c-red: #ff3b30;
            --c-orange: #ff9500;
            --c-yellow: #ffcc00;
            --c-lgreen: #a3e635;
            --c-green: #34c759;
        }
        * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        body {
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container { width: 100%; max-width: 400px; margin-top: 30px; }
        
        .header { text-align: center; margin-bottom: 30px; }
        .header h1 { margin: 0 0 5px 0; font-size: 28px; letter-spacing: 1px; }
        .header p { margin: 0; color: var(--text-muted); font-size: 14px; }

        .input-group { position: relative; margin-bottom: 15px; }
        .input-group input {
            width: 100%;
            padding: 15px 45px 15px 15px;
            background: var(--card-bg);
            border: 1px solid #2a2f3a;
            border-radius: 10px;
            color: var(--text);
            font-size: 16px;
            outline: none;
            transition: border 0.3s;
        }
        .input-group input:focus { border-color: var(--accent); }
        
        .eye-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            width: 20px;
            height: 20px;
            fill: var(--text-muted);
            transition: fill 0.3s;
        }
        .eye-icon:hover { fill: var(--text); }

        .trust-text {
            font-size: 12px;
            color: var(--text-muted);
            text-align: center;
            margin-bottom: 20px;
            line-height: 1.4;
        }

        .analyze-btn {
            width: 100%;
            padding: 15px;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s, transform 0.1s;
        }
        .analyze-btn:hover { opacity: 0.9; }
        .analyze-btn:active { transform: scale(0.98); }
        .analyze-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .chart-container {
            display: none;
            position: relative;
            height: 200px;
            margin-top: 40px;
            align-items: flex-end;
            justify-content: space-between;
            padding: 0 10px 20px 10px;
            border-bottom: 2px solid #2a2f3a;
        }
        
        .bar {
            width: 18%;
            border-radius: 6px 6px 0 0;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 10px;
            font-weight: bold;
            color: #000;
            writing-mode: vertical-rl;
            text-orientation: mixed;
            transform: rotate(180deg);
            z-index: 1;
        }
        
        .bar-1 { height: 20%; background: var(--c-red); }
        .bar-2 { height: 40%; background: var(--c-orange); }
        .bar-3 { height: 60%; background: var(--c-yellow); }
        .bar-4 { height: 80%; background: var(--c-lgreen); }
        .bar-5 { height: 100%; background: var(--c-green); }

        /* Слой для стрелки поверх всего */
        .arrow-svg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            overflow: visible;
        }

        /* Сама линия */
        #arrowLine {
            stroke: var(--accent);
            stroke-width: 4;
            stroke-linecap: round;
            filter: drop-shadow(0 0 6px var(--accent));
            transition: opacity 0.3s ease;
            opacity: 0;
        }

        /* Результат */
        .result-container {
            display: none;
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 0.5s ease;
        }
        .result-time { font-size: 22px; font-weight: bold; margin-bottom: 5px; }
        .result-rank { font-size: 14px; color: var(--text-muted); }
        .result-rank span { color: var(--text); font-weight: bold; }

        .footer {
            margin-top: 40px;
            text-align: center;
            font-size: 13px;
            color: var(--text-muted);
            padding: 20px 0;
            border-top: 1px solid #2a2f3a;
            line-height: 1.5;
        }
        
        .tg-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: transparent;
            color: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.3s;
        }
        .tg-btn:hover { background: rgba(0, 230, 118, 0.1); }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>CrackTime</h1>
            <p>Проверь надежность своего пароля</p>
        </div>

        <div class="input-group">
            <input type="password" id="password" placeholder="введите пароль" autocomplete="off">
            <svg class="eye-icon" id="eyeIcon" onclick="togglePassword()" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
        </div>

        <div class="trust-text">
            Данные конфиденциальны.<br>Вычисления происходят локально.
        </div>

        <button class="analyze-btn" id="analyzeBtn" onclick="analyze()">[ АНАЛИЗ ]</button>

        <div class="chart-container" id="chart">
            <svg class="arrow-svg" id="arrowSvg">
                <defs>
                    <!-- Железобетонный наконечник: markerUnits="userSpaceOnUse" не дает ему меняться в размере -->
                    <marker id="arrowHead" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="userSpaceOnUse">
                        <path d="M0,0 L12,6 L0,12 Z" fill="var(--accent)" />
                    </marker>
                </defs>
                <line id="arrowLine" x1="0" y1="0" x2="0" y2="0" marker-end="url(#arrowHead)" />
            </svg>

            <div class="bar bar-1" id="bar1">КРАХ</div>
            <div class="bar bar-2" id="bar2">СЛАБО</div>
            <div class="bar bar-3" id="bar3">СРЕДНЕ</div>
            <div class="bar bar-4" id="bar4">СЛОЖНО</div>
            <div class="bar bar-5" id="bar5">НЕВОЗМОЖНО</div>
        </div>

        <div class="result-container" id="result">
            <div class="result-time" id="timeText"></div>
            <div class="result-rank">Твой ранг: <span id="rankText"></span></div>
        </div>

        <div class="footer">
            Пароль — это база безопасности. Продвинутые методы защиты и анализа данных изучаем в моем Telegram.<br>
            <a href="https://t.me/pythonwave" target="_blank" class="tg-btn">Перейти в Telegram</a>
        </div>
    </div>

    <script>
        const levels = [
            { time: "10 СЕКУНД", rank: "[ ЧАЙНИК ]", color: "var(--c-red)", barId: "bar1" },
            { time: "2 ЧАСА", rank: "[ ДЫРЯВЫЙ ]", color: "var(--c-orange)", barId: "bar2" },
            { time: "3 МЕСЯЦА", rank: "[ БДИТЕЛЬНЫЙ ]", color: "var(--c-yellow)", barId: "bar3" },
            { time: "50 ЛЕТ", rank: "[ АНОНИМ ]", color: "var(--c-lgreen)", barId: "bar4" },
            { time: "13.8 МЛРД ЛЕТ", rank: "[ НЕСОКРУШИМЫЙ ]", color: "var(--c-green)", barId: "bar5" }
        ];

        const eyeOpen = "M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z";
        const eyeClosed = "M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z";

        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('eyeIcon');
            if (input.type === 'password') {
                input.type = 'text';
                icon.innerHTML = `<path d="${eyeClosed}"/>`;
            } else {
                input.type = 'password';
                icon.innerHTML = `<path d="${eyeOpen}"/>`;
            }
        }

        function analyze() {
            const pwd = document.getElementById('password').value;
            const btn = document.getElementById('analyzeBtn');
            const chart = document.getElementById('chart');
            const result = document.getElementById('result');
            const arrowLine = document.getElementById('arrowLine');
            
            if (!pwd) {
                alert("Введите пароль для анализа");
                return;
            }

            btn.disabled = true;
            btn.textContent = "АНАЛИЗ...";
            chart.style.display = "flex";
            result.style.display = "none";
            result.style.opacity = "0";
            
            arrowLine.style.opacity = "0";

            let score = 0;
            if (pwd.length > 8) score++;
            if (pwd.length > 12) score++;
            if (/[a-z]/.test(pwd)) score++;
            if (/[A-Z]/.test(pwd)) score++;
            if (/[0-9]/.test(pwd)) score++;
            if (/[^A-Za-z0-9]/.test(pwd)) score++;

            let levelIndex = 0;
            if (score <= 1) levelIndex = 0;
            else if (score === 2) levelIndex = 1;
            else if (score <= 4) levelIndex = 2;
            else if (score === 5) levelIndex = 3;
            else levelIndex = 4;

            const selectedLevel = levels[levelIndex];
            const targetBar = document.getElementById(selectedLevel.barId);
            const lastBar = document.getElementById('bar5');

            setTimeout(() => {
                arrowLine.style.opacity = "1";
                
                // 1. Начало (всегда в левом нижнем углу)
                const startX = 5; 
                const startY = chart.offsetHeight - 15; 

                // 2. Конец (всегда над самым высоким столбиком - чтобы вычислить идеальный угол)
                const maxX = lastBar.offsetLeft + (lastBar.offsetWidth / 2);
                const maxY = lastBar.offsetTop - 20; 

                // 3. Вычисляем угол наклона этой воображаемой линии
                const slope = (maxY - startY) / (maxX - startX);

                // 4. Вычисляем, где стрелка должна остановиться (над нужным столбиком)
                const endX = targetBar.offsetLeft + (targetBar.offsetWidth / 2);
                // Вычисляем Y по формуле прямой (y = kx + b)
                const endY = startY + (endX - startX) * slope;

                // 5. Рисуем
                arrowLine.setAttribute('x1', startX);
                arrowLine.setAttribute('y1', startY);
                arrowLine.setAttribute('x2', endX);
                arrowLine.setAttribute('y2', endY);

                setTimeout(() => {
                    document.getElementById('timeText').textContent = `ВРЕМЯ ВЗЛОМА: ${selectedLevel.time}`;
                    document.getElementById('timeText').style.color = selectedLevel.color;
                    
                    document.getElementById('rankText').textContent = selectedLevel.rank;
                    document.getElementById('rankText').style.color = selectedLevel.color;

                    result.style.display = "block";
                    void result.offsetWidth; 
                    result.style.opacity = "1";

                    btn.disabled = false;
                    btn.textContent = "[ АНАЛИЗ ]";
                }, 600); 
            }, 300); 
        }
    </script>
</body>
</html>
